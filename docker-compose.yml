# Docker Compose file for Vapor
#
# Install Docker on your system to run and test
# your Vapor app in a production-like environment.
#
# Note: This file is intended for testing and does not
# implement best practices for a production deployment.
#
# Learn more: https://docs.docker.com/compose/reference/
#
#   Build images: docker-compose build
#      Start app: docker-compose up app
#       Stop all: docker-compose down
#
x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug}

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile-nginx # Use the Dockerfile for Nginx
    ports:
      - '80:80' # Nginx frontend HTTP/S (Nginx handles redirect from 443 to 443)
      - '443:443' # Nginx frontend HTTP/S (Nginx handles redirect from 443 to 443)
      - '8081:8081' # Nginx backend HTTP/S
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf:ro' # Mount the Nginx config
      - './ssl:/etc/nginx/ssl:ro'               # Mount SSL certificates (create this directory on host)
      - './logs/nginx:/var/log/nginx'           # Mount Nginx logs to host volume
    depends_on:
      - client
      - server
    restart: unless-stopped

  client:
    image: foscompsvcs/fos-showcase-client:latest
    build:
      context: .
      dockerfile: Dockerfile-client
    environment:
      <<: *shared_environment
      # Base URL for backend-served assets. Empty = relative/same-origin
      # (/Images/... routed to the backend by nginx on 443). Override only
      # to serve assets from another origin/CDN.
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
    # Ports are now internal, exposed to Nginx, not directly to the host
    expose:
      - '8082' # Expose internal port for Nginx to access
    volumes:
      - './logs/client:/var/log/vapor_client'  # Mount client logs to host volume
    # user: '0' # uncomment to run as root for testing purposes even though Dockerfile defines 'vapor' user.
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8082"]

  server:
    image: foscompsvcs/fos-showcase-server:latest
    build:
      context: .
      dockerfile: Dockerfile-server
    environment:
      <<: *shared_environment
      DATABASE_HOST: ${DATABASE_HOST:-10.1.2.158}
      DATABASE_PORT: 5432
      DATABASE_NAME: foscs
      DATABASE_USER: openclaw_webhook
      DATABASE_PASSWORD: ${POSTGRES_WEBHOOK_PASSWORD}
      MIGRATION_DATABASE_USER: openclaw_admin
      MIGRATION_DATABASE_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    # Ports are now internal, exposed to Nginx, not directly to the host
    expose:
      - '8083' # Expose internal port for Nginx to access
    volumes:
      - './logs/server:/var/log/vapor_server'  # Mount server logs to host volume
    # user: '0' # uncomment to run as root for testing purposes even though Dockerfile defines 'vapor' user.
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8083"]
