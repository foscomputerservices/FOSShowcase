# nginx.conf

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting for webhook endpoints
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=10r/s;

    # Redirect HTTP (port 80) to HTTPS (port 443 for client)
    server {
        listen 80;
        server_name foscomputerservices.com *.foscomputerservices.com;
        return 301 https://$host:443$request_uri;
    }

    # Client (Frontend) Server - HTTPS on port 443
    server {
        listen 443 ssl;
        server_name foscomputerservices.com *.foscomputerservices.com;

        # SSL Certificates (will be mounted from host)
        ssl_certificate /etc/nginx/ssl/foscomputerservices.com.crt;
        ssl_certificate_key /etc/nginx/ssl/foscomputerservices.com.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Webhook endpoints with rate limiting (proxy to backend server)
        location /webhooks/ {
            limit_req zone=webhooks burst=20 nodelay;
            proxy_pass http://server:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30;
        }

        # Static assets (images, etc.) are served by the backend; route them
        # over 443 so the public site needs no separate 8081 exposure.
        location /Images/ {
            proxy_pass http://server:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # Proxy to the client service
        location / {
            proxy_pass http://client:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }
    }

    # Server (Backend) Server - HTTPS on port 8081
    server {
        listen 8081 ssl;
        server_name foscomputerservices.com *.foscomputerservices.com;

        # SSL Certificates (will be mounted from host)
        ssl_certificate /etc/nginx/ssl/foscomputerservices.com.crt;
        ssl_certificate_key /etc/nginx/ssl/foscomputerservices.com.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Webhook endpoints with rate limiting
        location /webhooks/ {
            limit_req zone=webhooks burst=20 nodelay;
            proxy_pass http://server:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30;
        }

        # Proxy to the server service
        location / {
            proxy_pass http://server:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }
    }
}
