tr:
  LandingPageAboutViewModel:
    title: "Hakkımızda"
    subtitle1: "36 yılı aşkın yazılım geliştirme deneyimine sahip bir yazılım geliştiricisi olan David Hunt tarafından kurulan danışmanlık firmamız, ölçeklenebilir backend çözümleri ile yüksek kaliteli iOS ve macOS uygulamaları geliştirme konusunda uzmanlaşmıştır. Beklentileri aşan yazılımlar sunmak için her büyüklükteki işletmeyle yakın çalışıyoruz."
    subtitle2: "Ekibimiz, müşterilerimizin iş hedeflerine ulaşmalarına yardımcı olan olağanüstü dijital deneyimler yaratma konusunda derin teknik uzmanlık ve tutku sunuyor."
    fact1: "15+ yıl iOS ve macOS geliştirme deneyimi"
    fact2: "Swift, SwiftUI ve Vapor uzmanlığı"
    fact3: "Test Odaklı Geliştirme (TDD) sürecini benimsiyoruz"
    fact4: "Vapor ve Swift ile backend geliştirme"
    fact5: "Mobil uygulamalar ve bulut hizmetleri arasında kusursuz entegrasyon"
    fact6: "Sürekli destek ve bakım hizmetleri"
